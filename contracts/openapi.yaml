openapi: 3.0.3
info:
  title: Astro Bone Twin API
  version: 0.1.4
  description: |
    SINGLE SOURCE OF TRUTH for every data shape in this project.

    - Frontend  <-> Backend : the HTTP paths below.
    - Backend   <-> AI/Data : the `EngineInput` -> `Forecast` pair (see `twin_core.Engine`).

    Nobody edits generated code. Change THIS file (via a contract PR approved by all
    three owners), run `make gen`, commit the regenerated files.

    Units: BMD in g/cm2; `*_pct_change` are percent change from the crew member's own
    pre-flight baseline (negative = loss); mission_day 0 = launch, negative = pre-flight.
    Marker units are fixed per marker (see `MarkerId`).
servers:
  - url: http://localhost:8000
tags:
  - name: meta
  - name: catalog
  - name: crew
  - name: forecast
  - name: telemetry
  - name: osdr

paths:
  /api/v1/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Liveness and active engine
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/v1/model-info:
    get:
      tags: [meta]
      operationId: getModelInfo
      summary: Assumptions, limitations and data sources of the active engine (shown in the UI)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelInfo" }

  /api/v1/scenarios:
    get:
      tags: [catalog]
      operationId: listScenarios
      summary: Mission scenarios
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioList" }

  /api/v1/countermeasures:
    get:
      tags: [catalog]
      operationId: listCountermeasures
      summary: Countermeasure catalog
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountermeasureList" }

  /api/v1/crew:
    get:
      tags: [crew]
      operationId: listCrew
      summary: Crew members (simulated)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrewList" }

  /api/v1/crew/{crew_id}:
    get:
      tags: [crew]
      operationId: getCrewMember
      summary: One crew member
      parameters:
        - { $ref: "#/components/parameters/CrewId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrewMember" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/crew/{crew_id}/measurements:
    get:
      tags: [crew]
      operationId: listMeasurements
      summary: Biomarker measurements of a crew member, ordered by mission_day
      parameters:
        - { $ref: "#/components/parameters/CrewId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeasurementList" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [crew]
      operationId: addMeasurement
      summary: Record a new biomarker measurement
      parameters:
        - { $ref: "#/components/parameters/CrewId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeasurementCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Measurement" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/forecast:
    post:
      tags: [forecast]
      operationId: createForecast
      summary: Bone-loss trajectory with uncertainty for one crew member and one plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForecastRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Forecast" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/whatif:
    post:
      tags: [forecast]
      operationId: compareWhatIf
      summary: Compare 2-4 countermeasure plans for the same crew member and scenario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhatIfRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatIfResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/telemetry/crew:
    get:
      tags: [telemetry]
      operationId: listTelemetryCrew
      summary: Crew roster enriched with simulated telemetry; bone-loss risk from the real engine forecast
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelemetryCrewPayload" }

  /api/v1/osdr/studies:
    get:
      tags: [osdr]
      operationId: listOsdrStudies
      summary: NASA OSDR study bundles with per-study gene-expression records (from data/processed/osdr)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OsdrStudiesPayload" }
        "503":
          description: OSDR data directory missing or empty
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  parameters:
    CrewId:
      name: crew_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: Request body failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ------------------------------------------------------------------ meta
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. not_found, validation_error, engine_error
        message: { type: string }
        details:
          type: object
          nullable: true
          additionalProperties: true

    EngineKind:
      type: string
      enum: [stub, statistical, ml]

    EngineInfo:
      type: object
      required: [name, version, kind]
      properties:
        name: { type: string }
        version: { type: string }
        kind: { $ref: "#/components/schemas/EngineKind" }

    Health:
      type: object
      required: [status, api_version, engine]
      properties:
        status:
          type: string
          enum: [ok]
        api_version: { type: string }
        engine: { $ref: "#/components/schemas/EngineInfo" }

    DataSource:
      type: object
      required: [name, usage]
      properties:
        name: { type: string }
        url: { type: string, nullable: true }
        usage: { type: string, description: What we use it for }

    ModelInfo:
      type: object
      required: [engine, assumptions, limitations, data_sources, disclaimer]
      properties:
        engine: { $ref: "#/components/schemas/EngineInfo" }
        assumptions:
          type: array
          items: { type: string }
        limitations:
          type: array
          items: { type: string }
        data_sources:
          type: array
          items: { $ref: "#/components/schemas/DataSource" }
        disclaimer: { type: string }

    # --------------------------------------------------------------- catalog
    BoneSite:
      type: string
      enum: [lumbar_spine, femoral_neck, total_hip, distal_tibia]

    MarkerId:
      type: string
      description: |
        Biomarker ids and their FIXED units:
        ctx (ng/mL, resorption), p1np (ng/mL, formation), urine_calcium (mmol/24h),
        vitamin_d_25oh (nmol/L), pth (pg/mL).
      enum: [ctx, p1np, urine_calcium, vitamin_d_25oh, pth]

    Scenario:
      type: object
      required: [id, name, duration_days, description]
      properties:
        id: { type: string }
        name: { type: string }
        duration_days: { type: integer, minimum: 1 }
        description: { type: string }

    ScenarioList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Scenario" }

    CountermeasureCategory:
      type: string
      enum: [exercise, nutrition, pharmacological]

    EvidenceLevel:
      type: string
      enum: [established, limited, experimental]

    Countermeasure:
      type: object
      required:
        [id, name, category, evidence_level, summary, contraindications, requires_physician_approval]
      properties:
        id: { type: string }
        name: { type: string }
        category: { $ref: "#/components/schemas/CountermeasureCategory" }
        evidence_level: { $ref: "#/components/schemas/EvidenceLevel" }
        summary: { type: string }
        contraindications:
          type: array
          items: { type: string }
        requires_physician_approval: { type: boolean }

    CountermeasureList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Countermeasure" }

    # ------------------------------------------------------------------ crew
    Sex:
      type: string
      enum: [female, male]

    BoneBaseline:
      type: object
      required: [site, bmd_g_cm2]
      properties:
        site: { $ref: "#/components/schemas/BoneSite" }
        bmd_g_cm2: { type: number, minimum: 0 }

    CrewMember:
      type: object
      required: [id, display_name, sex, age_years, baseline_bmd]
      properties:
        id: { type: string }
        display_name: { type: string, description: Fictional name }
        sex: { $ref: "#/components/schemas/Sex" }
        age_years: { type: integer, minimum: 18, maximum: 80 }
        baseline_bmd:
          type: array
          items: { $ref: "#/components/schemas/BoneBaseline" }

    CrewList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CrewMember" }

    MeasurementCreate:
      type: object
      additionalProperties: false
      required: [mission_day, marker, value]
      properties:
        mission_day: { type: integer, minimum: -365, maximum: 1500 }
        marker: { $ref: "#/components/schemas/MarkerId" }
        # maximum is a generous guard against non-finite values; physiological ranges
        # are marker-specific and intentionally not encoded here
        value: { type: number, minimum: 0, maximum: 1000000 }

    Measurement:
      type: object
      required: [id, crew_id, mission_day, marker, value, unit, recorded_at]
      properties:
        id: { type: integer }
        crew_id: { type: string }
        mission_day: { type: integer, minimum: -365, maximum: 1500 }
        marker: { $ref: "#/components/schemas/MarkerId" }
        value: { type: number, minimum: 0 }
        unit: { type: string }
        recorded_at: { type: string, format: date-time }

    MeasurementList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Measurement" }

    # -------------------------------------------------------------- forecast
    ForecastRequest:
      type: object
      additionalProperties: false
      required: [crew_id, scenario_id]
      properties:
        crew_id: { type: string }
        scenario_id: { type: string }
        countermeasure_ids:
          type: array
          default: []
          items: { type: string }

    ForecastPoint:
      type: object
      required: [day, mean_pct_change, lower_95, upper_95]
      properties:
        day: { type: integer, minimum: 0 }
        mean_pct_change: { type: number }
        lower_95: { type: number }
        upper_95: { type: number }

    RiskLevel:
      type: string
      enum: [low, moderate, high]

    RiskSummary:
      type: object
      required: [threshold_pct_change, prob_below_threshold_at_end, level]
      properties:
        threshold_pct_change:
          type: number
          description: Loss threshold being tested, e.g. -10 means 10% below baseline
        prob_below_threshold_at_end:
          type: number
          minimum: 0
          maximum: 1
        level: { $ref: "#/components/schemas/RiskLevel" }

    SiteForecast:
      type: object
      required: [site, points, risk]
      properties:
        site: { $ref: "#/components/schemas/BoneSite" }
        points:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/ForecastPoint" }
        risk: { $ref: "#/components/schemas/RiskSummary" }

    DriverDirection:
      type: string
      enum: [protective, harmful, neutral]

    Driver:
      type: object
      required: [signal, direction, weight, explanation]
      properties:
        signal: { type: string }
        direction: { $ref: "#/components/schemas/DriverDirection" }
        weight:
          type: number
          minimum: 0
          maximum: 1
        explanation: { type: string }

    Forecast:
      type: object
      required:
        - crew_id
        - scenario_id
        - countermeasure_ids
        - horizon_days
        - generated_at
        - engine
        - sites
        - drivers
        - warnings
        - requires_physician_review
        - disclaimer
      properties:
        crew_id: { type: string }
        scenario_id: { type: string }
        countermeasure_ids:
          type: array
          items: { type: string }
        horizon_days: { type: integer, minimum: 1 }
        generated_at: { type: string, format: date-time }
        engine: { $ref: "#/components/schemas/EngineInfo" }
        sites:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SiteForecast" }
        drivers:
          type: array
          items: { $ref: "#/components/schemas/Driver" }
        warnings:
          type: array
          items: { type: string }
        requires_physician_review: { type: boolean }
        disclaimer: { type: string }

    WhatIfPlan:
      type: object
      additionalProperties: false
      required: [plan_id, label, countermeasure_ids]
      properties:
        plan_id: { type: string }
        label: { type: string }
        countermeasure_ids:
          type: array
          items: { type: string }

    WhatIfRequest:
      type: object
      additionalProperties: false
      required: [crew_id, scenario_id, plans]
      properties:
        crew_id: { type: string }
        scenario_id: { type: string }
        plans:
          type: array
          minItems: 2
          maxItems: 4
          items: { $ref: "#/components/schemas/WhatIfPlan" }

    WhatIfResult:
      type: object
      required: [plan_id, label, forecast]
      properties:
        plan_id: { type: string }
        label: { type: string }
        forecast: { $ref: "#/components/schemas/Forecast" }

    WhatIfResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/WhatIfResult" }

    # ------------------------------------------------ Backend <-> AI engine
    # Not exposed over HTTP. This is the input the backend hands to
    # `twin_core.Engine.forecast()`; the engine returns a `Forecast`.
    EngineInput:
      type: object
      required: [crew, scenario, measurements, countermeasures]
      properties:
        crew: { $ref: "#/components/schemas/CrewMember" }
        scenario: { $ref: "#/components/schemas/Scenario" }
        measurements:
          type: array
          items: { $ref: "#/components/schemas/Measurement" }
        countermeasures:
          type: array
          items: { $ref: "#/components/schemas/Countermeasure" }

    # ----------------------------------- UI integration (contract 0.1.2)
    Status:
      type: string
      enum: [upregulated, downregulated]

    SyncStatus:
      type: string
      enum: [ready, syncing]

    AffectedGene:
      type: object
      required: [symbol, log2fc, change_percent, p_value, status]
      properties:
        symbol: { type: string }
        source_symbol: { type: string, nullable: true }
        source_log2fc: { type: number, nullable: true }
        ortholog_symbol: { type: string, nullable: true }
        mouse_symbol: { type: string, nullable: true }
        ensembl: { type: string, nullable: true }
        fold_change: { type: number, nullable: true }
        log2fc: { type: number }
        change_percent: { type: number }
        p_value: { type: number, nullable: true }
        adj_p_value: { type: number, nullable: true }
        stat: { type: number, nullable: true }
        gene_name: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/Status" }
        osdr_ref: { type: string, nullable: true }
        contrast_column: { type: string, nullable: true }
        tissue: { type: string, nullable: true }
        contrast: { type: string, nullable: true }
        measured: { type: boolean, nullable: true }
        significant: { type: boolean, nullable: true }

    TelemetryCrewMember:
      type: object
      required: [id, name, name_ar, role, role_ar, mission, mission_ar, space_days,
        radiation_msv, eva_hours, age, blood_type, baseline_bmd_t_score,
        current_bmd_t_score, bone_loss_risk_percentage, dna_damage_index,
        cellular_repair_efficiency, affected_genes, cohort_type, gene_data_source]
      properties:
        id: { type: string, description: "Contract crew id (links telemetry to crew, measurements and forecast)" }
        name: { type: string }
        name_ar: { type: string }
        role: { type: string }
        role_ar: { type: string }
        mission: { type: string }
        mission_ar: { type: string }
        space_days: { type: integer, minimum: 0, description: Simulated mission day count }
        radiation_msv: { type: number, description: Simulated cumulative dose in mSv }
        eva_hours: { type: number, description: Simulated EVA hours }
        age: { type: integer }
        blood_type: { type: string }
        baseline_bmd_t_score: { type: number, description: Illustrative T-score mapping of the contract baseline BMD }
        current_bmd_t_score: { type: number, description: Baseline T-score shifted by the engine forecast end value }
        bone_loss_risk_percentage: { type: number, description: "Predicted worst-site BMD % change at mission horizon from the unmitigated baseline forecast (negative = loss)" }
        dna_damage_index: { type: number, description: Simulated 0-100 index }
        cellular_repair_efficiency: { type: number, description: Simulated 0-100 index }
        affected_genes: { type: array, items: { $ref: "#/components/schemas/AffectedGene" } }
        cohort_type: { type: string, enum: [simulated_mission_telemetry] }
        gene_data_source: { type: string, nullable: true }

    TelemetryCrewPayload:
      type: object
      required: [count, crew]
      properties:
        count: { type: integer }
        crew: { type: array, items: { $ref: "#/components/schemas/TelemetryCrewMember" } }

    OsdrStudy:
      type: object
      required: [accession, glds, title, description, organism, material_type, project_type,
        mission, assay, platform, release_date, tissue_label, de_file, contrast, genes,
        source_url, osdr_url, fetched_at, stale]
      properties:
        accession: { type: string }
        glds: { anyOf: [ { type: string }, { type: array, items: { type: string } } ] }
        title: { type: string }
        description: { type: string }
        organism: { type: string }
        material_type: { anyOf: [ { type: string }, { type: array, items: { type: string } } ] }
        project_type: { type: string }
        mission: { type: string }
        assay: { anyOf: [ { type: string }, { type: array, items: { type: string } } ] }
        platform: { anyOf: [ { type: string }, { type: array, items: { type: string } } ] }
        release_date: { type: integer, nullable: true }
        tissue_label: { type: string }
        de_file: { type: string }
        contrast: { type: string }
        genes: { type: object, additionalProperties: { $ref: "#/components/schemas/AffectedGene" } }
        source_url: { type: string }
        osdr_url: { type: string }
        fetched_at: { type: string }
        stale: { type: boolean, description: Filled server-side as false when absent in cached bundles }

    OsdrStudiesPayload:
      type: object
      required: [source, repository, count, expected_count, sync_status, studies]
      properties:
        source: { type: string }
        repository: { type: string }
        count: { type: integer }
        expected_count: { type: integer }
        sync_status: { $ref: "#/components/schemas/SyncStatus" }
        studies: { type: array, items: { $ref: "#/components/schemas/OsdrStudy" } }
