[project]
name = "bonetwin-api"
version = "0.1.0"
description = "Backend: FastAPI app implementing contracts/openapi.yaml"
requires-python = ">=3.11"
dependencies = [
  "bonetwin-contracts",
  "twin-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bonetwin_api"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The API may use the AI package ONLY through its public surface: `from twin_core import ...`
"twin_core.engines".msg = "Import from `twin_core` (public API) only."
"twin_core.sim".msg = "Import from `twin_core` (public API) only."
"twin_core.ingest".msg = "Import from `twin_core` (public API) only."
"twin_core.protocol".msg = "Import from `twin_core` (public API) only."
"twin_core.registry".msg = "Import from `twin_core` (public API) only."
