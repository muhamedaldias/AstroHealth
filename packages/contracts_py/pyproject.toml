[project]
name = "bonetwin-contracts"
version = "0.1.0"
description = "GENERATED pydantic models from contracts/openapi.yaml. Do not edit by hand."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bonetwin_contracts"]
