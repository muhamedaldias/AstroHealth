name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make setup
      # spec-lint, gen-check (generated code up to date), ruff, biome, ownership,
      # typecheck, pytest, vitest, web build -- exactly what you run locally.
      - run: make check
